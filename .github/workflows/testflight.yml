name: TestFlight

# 合併進 master 就自動上傳;也可以手動觸發(gh workflow run testflight.yml --ref master)。
# 只改文件的合併不上傳。流程與設定見 docs/testflight.md。
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # 同一份程式碼不測兩次：這個 commit 是 PR 的 merge commit,而且那個 PR 的 CI 成功過，就直接上傳。
  # 其他情況(直接 push、手動觸發在沒跑過 CI 的 commit 上)才在這裡跑完整的 CI。
  check:
    name: 確認 PR 的 CI 已通過
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # merge commit 的第二個 parent 是 PR 的 head;pull_request 觸發的 CI 記的 head_sha 就是它。
          # ponytail: 沒比對 PR 測試當時的 master。兩個 PR 接連合併時，後合併的那個沒測過合併後的組合;
          # 要嚴格就改成要求 PR 合併前先更新到最新的 master。
          head="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[1].sha // ""')"
          tested=false
          if [ -n "$head" ]; then
            runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq '.total_count')"
            if [ "$runs" -gt 0 ]; then tested=true; fi
          fi
          echo "PR head:${head:-(不是 merge commit)},CI 已通過:$tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    # test 被略過(PR 的 CI 已通過)時也要上傳，所以不用預設的 success()。
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.check.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [check, test]
    runs-on: xcode-27
    timeout-minutes: 60
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: xcodebuild -version

      # 簽章只在匯出時做:archive 不簽章(不需要 Apple Development 憑證)，匯出時用 App Store Connect team API key
      # 註冊 App ID、建立描述檔，用 Apple 雲端管理的 Distribution 憑證簽章(固定的一張，不隨 runner 重建)。
      # 以前 archive 也自動簽章，每次都在全新的 runner 上建一張「Created via API」的 Apple Development 憑證，
      # 累積到帳號的上限就失敗(「maximum number of certificates」，2026-10-02)。
      # 版本號沿用專案的 MARKETING_VERSION,build 號用 GITHUB_RUN_ID。
      - name: Archive 並上傳到 TestFlight
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?testflight environment 缺少變數 APPLE_TEAM_ID}"
          : "${ASC_KEY_ID:?testflight environment 缺少 secret ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?testflight environment 缺少 secret ASC_ISSUER_ID}"
          : "${ASC_PRIVATE_KEY:?testflight environment 缺少 secret ASC_PRIVATE_KEY}"

          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/MyMoney.xcarchive"
          trap 'rm -f "$key_path"' EXIT
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"

          xcodebuild archive \
            -project src/App/MyMoney.xcodeproj \
            -scheme MyMoney \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/ArchiveDerivedData" \
            -hideShellScriptEnvironment \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_ID"

          # 不簽章的 archive 裡沒有團隊資訊:匯出設定要帶 teamID(Team ID 在 environment 變數裡，不進 repo)。
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cp .github/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          version="$(plutil -extract ApplicationProperties.CFBundleShortVersionString raw -o - "$archive_path/Info.plist")"
          ASC_KEY_PATH="$key_path" ruby scripts/wait-for-testflight.rb \
            --version "$version" \
            --build-number "$GITHUB_RUN_ID" \
            --timeout 1800 \
            --interval 30

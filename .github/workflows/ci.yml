name: CI

# master 不另外跑:合併進 master 的程式碼已經在 PR 測過;TestFlight 只在 PR 沒測過時呼叫這裡(testflight.yml)。
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# 群組名稱帶 workflow 名稱：被 TestFlight 呼叫時 github.workflow 是「TestFlight」,不會跟 PR 的 CI 搶同一個群組。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 兩個 job 都跑在 xcode-27:GitHub 的 preview 映像(底層 macOS 27,預設 Xcode 27 / iOS 27 SDK)。
# preview 不穩(排隊超過 30 分鐘、映像壞掉)時，把 runs-on 暫時退回 macos-26(預設 Xcode 26.6),
# 並在 PR 記錄證據;穩定後改回 xcode-27。
jobs:
  package:
    name: Package 測試(swift test)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: |
          xcodebuild -version
          swift --version

      # warning 當 error 寫在 Package.swift(只對 macOS 套用)。
      # import check 抓「沒宣告依賴卻 import」,例如 Features import API。
      - name: swift test
        run: swift test --explicit-target-dependency-import-check error

      # Xcode 建置 app 時會把 package 的 warning 壓掉，所以另外在 package 根目錄以 iOS 編譯一次，
      # 讓只有 iOS 才編譯的程式碼(#if os(iOS))也受 warning 當 error 把關。
      - name: 以 iOS 編譯 package
        run: >
          xcodebuild build
          -scheme MyMoney-Package
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData/package
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  # CI 完全不做 UI 測試(連編譯都不做):實測要 49 分鐘(建置 5 分、56 個 UI 測試 34 分、收集診斷逾時再等 10 分),
  # 太久了。UI 測試在本機跑，而且只跑有修改到的(見 CLAUDE.md「常用指令」)。
  # CI 只保證 app 編得過、零 warning,幾分鐘就好。
  app:
    name: App 編譯(xcodebuild build)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: xcodebuild -version

      # 只編譯 app,不編譯也不跑 UI 測試,不啟動模擬器。warning 當 error 設在專案的 build settings。
      - name: xcodebuild build
        run: >
          xcodebuild build
          -project src/App/MyMoney.xcodeproj
          -scheme MyMoney
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData
          -resultBundlePath .derivedData/MyMoney.xcresult

      - name: 檢查零 warning
        run: |
          xcrun xcresulttool get build-results --path .derivedData/MyMoney.xcresult > build-results.json
          warnings="$(jq '.warningCount' build-results.json)"
          echo "warningCount=$warnings"
          jq -r '.warnings[]? | "::warning::\(.message)"' build-results.json
          test "$warnings" -eq 0

      - name: 上傳建置結果
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MyMoney.xcresult
          path: .derivedData/MyMoney*.xcresult
          retention-days: 7
